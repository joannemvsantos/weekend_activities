name: Refresh Menox events

on:
  schedule:
    - cron: "0 6 * * 4" # every Thursday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/fetch-menox.py > data/menox.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menox.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Refresh Menox events"
          git push
